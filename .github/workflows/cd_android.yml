# cd.yml
name: Android Deployment

on:
  push:
    branches:
      - beta-releases

jobs:
  # CD
  deploy_android:
    runs-on: ubuntu-latest
    # Beta release only
    if: github.ref == 'refs/heads/beta-releases'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          check-latest: true
          cache: "gradle"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Cache Ruby gems (fastlane)
        uses: actions/cache@v4
        with:
          path: ~/.gem
          key: ${{ runner.os }}-ruby-gems-${{ hashFiles('.github/workflows/cd_android.yml') }}
          restore-keys: |
            ${{ runner.os }}-ruby-gems-

      - name: Add Ruby user gem bin to PATH
        run: echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Decode Android keystore from secret
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create Android key.properties
        run: |
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="upload"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; fi

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify upload keystore fingerprint
        run: |
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="upload"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; fi

          SHA1_LINE=$(keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "$KEY_PASSWORD" | grep "SHA1:")

          echo "$SHA1_LINE"

          EXPECTED_SHA1="${{ secrets.ANDROID_UPLOAD_CERT_SHA1 }}"
          if [ -n "$EXPECTED_SHA1" ]; then
            NORMALIZED_ACTUAL=$(echo "$SHA1_LINE" | sed -E 's/.*SHA1:[[:space:]]*//' | tr '[:lower:]' '[:upper:]')
            NORMALIZED_EXPECTED=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]')
            if [ "$NORMALIZED_ACTUAL" != "$NORMALIZED_EXPECTED" ]; then
              echo "Keystore SHA1 mismatch."
              echo "Actual:   $NORMALIZED_ACTUAL"
              echo "Expected: $NORMALIZED_EXPECTED"
              exit 1
            fi
          fi

      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --parallel --build-cache

      - name: Generate release description txt
        run: |
          VERSION_CODE=$(node -e "const fs=require('fs'); const p='android/app/build/outputs/bundle/release/output-metadata.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); const e=(j.elements&&j.elements[0])||{}; process.stdout.write(String(e.versionCode||j.versionCode||''));")

          if [ -z "$VERSION_CODE" ]; then
            echo "Could not determine versionCode from output-metadata.json"
            exit 1
          fi

          mkdir -p .ci/play-metadata/android/fr-FR/changelogs
          mkdir -p .ci/play-metadata/android/en-US/changelogs

          BASE_SHA="${{ github.event.before }}"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s (%h)' "$BASE_SHA"..HEAD)
          else
            CHANGELOG=$(git log --no-merges -n 20 --pretty=format:'- %s (%h)' HEAD)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Internal CI build"
          fi

          {
            echo "Reactif CI build"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${GITHUB_SHA::7}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Changes:"
            echo "$CHANGELOG"
          } > .ci/release-notes.txt

          cp .ci/release-notes.txt ".ci/play-metadata/android/fr-FR/changelogs/${VERSION_CODE}.txt"
          cp .ci/release-notes.txt ".ci/play-metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

      - name: Upload release description artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-description
          path: .ci/release-notes.txt
          if-no-files-found: error

      - name: Install fastlane
        run: gem install fastlane --user-install -N

      - name: Upload to Google Play Internal track
        run: |
          cat > /tmp/google-play-service-account.json <<EOF
          ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EOF
          fastlane android internal_release
        env:
          SUPPLY_TIMEOUT: 300
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          PLAY_TRACK: internal
          PLAY_JSON_KEY: /tmp/google-play-service-account.json
          PLAY_METADATA_PATH: .ci/play-metadata/android
