# cd.yml
name: Android Deployment

on:
  push:
    branches:
      - beta-releases

jobs:
  # CD
  deploy_android:
    runs-on: macos-latest
    # Beta release only
    if: github.ref == 'refs/heads/beta-releases'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install JS dependencies
        run: npm ci
      - name: Générer le projet Android (Expo Prebuild)
        run: npx expo prebuild --platform android
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          check-latest: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Android keystore from secret
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create Android key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=upload
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Build Android App Bundle and APK
        run: |
          cd android
          ./gradlew clean bundleRelease assembleRelease --no-daemon

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload to Google Play Internal track
        run: |
          cat > /tmp/google-play-service-account.json <<EOF
          ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EOF
          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --json_key /tmp/google-play-service-account.json \
            --package_name fr.reactif \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_metadata true
        env:
          SUPPLY_TIMEOUT: 300
