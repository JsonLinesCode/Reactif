# cd.yml
name: Android Deployment

on:
  push:
    branches:
      - beta-releases

jobs:
  # CD
  deploy_android:
    runs-on: ubuntu-latest
    # Beta release only
    if: github.ref == 'refs/heads/beta-releases'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci
      - name: Générer le projet Android (Expo Prebuild)
        run: npx expo prebuild --platform android
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          check-latest: true
          cache: "gradle"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Cache Ruby gems (fastlane)
        uses: actions/cache@v4
        with:
          path: ~/.gem
          key: ${{ runner.os }}-ruby-gems-${{ hashFiles('.github/workflows/cd_android.yml') }}
          restore-keys: |
            ${{ runner.os }}-ruby-gems-

      - name: Add Ruby user gem bin to PATH
        run: echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Decode Android keystore from secret
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create Android key.properties
        run: |
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="upload"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; fi

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify upload keystore fingerprint
        run: |
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="upload"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; fi

          SHA1_LINE=$(keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "$KEY_PASSWORD" | grep "SHA1:")

          echo "$SHA1_LINE"

          EXPECTED_SHA1="${{ secrets.ANDROID_UPLOAD_CERT_SHA1 }}"
          if [ -n "$EXPECTED_SHA1" ]; then
            NORMALIZED_ACTUAL=$(echo "$SHA1_LINE" | sed -E 's/.*SHA1:[[:space:]]*//' | tr '[:lower:]' '[:upper:]')
            NORMALIZED_EXPECTED=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]')
            if [ "$NORMALIZED_ACTUAL" != "$NORMALIZED_EXPECTED" ]; then
              echo "Keystore SHA1 mismatch."
              echo "Actual:   $NORMALIZED_ACTUAL"
              echo "Expected: $NORMALIZED_EXPECTED"
              exit 1
            fi
          fi

      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --parallel --build-cache --configuration-cache

      - name: Install fastlane
        run: gem install fastlane --user-install -N

      - name: Upload to Google Play Internal track
        run: |
          cat > /tmp/google-play-service-account.json <<EOF
          ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EOF
          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --json_key /tmp/google-play-service-account.json \
            --package_name fr.reactif \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_metadata true
        env:
          SUPPLY_TIMEOUT: 300
